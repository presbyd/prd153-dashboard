  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,
    {name:"AES-GCM",length:256},true,["decrypt"]);}
(async()=>{let raw=null;try{raw=localStorage.getItem(KEYNAME)}catch(e){}
  if(raw){try{const k=await crypto.subtle.importKey("raw",u8(raw),"AES-GCM",false,["decrypt"]);await show(k);return}
  catch(e){try{localStorage.removeItem(KEYNAME)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();
  const err=document.getElementById("err"),go=document.getElementById("go");err.textContent="";go.disabled=true;go.textContent="Opening…";
  try{const k=await derive(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){try{const r=new Uint8Array(await crypto.subtle.exportKey("raw",k));
      localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...r)))}catch(e){}}
    await show(k);}
  catch(e){err.textContent=window.crypto&&crypto.subtle?"Wrong password.":"This browser can't decrypt the page (needs HTTPS and WebCrypto).";
    go.disabled=false;go.textContent="Open";}});
